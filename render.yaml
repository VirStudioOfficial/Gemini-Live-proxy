services:
  - type: web
    name: gemini-live-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: LIVE_MODEL
        value: gemini-2.5-flash-native-audio-preview-09-2025
